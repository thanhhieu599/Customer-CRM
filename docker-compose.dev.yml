# Local development: only the databases. Run API and web with npm (see README).
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm }
    ports: ['5432:5432']
    volumes: [pgdev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdev:

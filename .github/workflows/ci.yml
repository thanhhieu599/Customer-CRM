name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Migrate test database
        run: npx prisma migrate deploy
        working-directory: apps/api
      - name: E2E tests (PostgreSQL + Redis)
        run: npm run test:e2e -w apps/api
      - name: Build
        run: npm run build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: crm, POSTGRES_PASSWORD: crm, POSTGRES_DB: crm_e2e }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_e2e?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - name: Typecheck
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Migrate test database
        run: npm run prisma:deploy:wasm -w apps/api
      - name: E2E tests (PostgreSQL + Redis)
        run: npm run test:e2e -w apps/api
      - name: Build
        run: npm run build
      - name: Create isolated browser-test database
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            try { await db.query('CREATE DATABASE crm_ui'); }
            finally { await db.end(); }
          })().catch(error => { console.error(error.message); process.exit(1); });
          NODE
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser workflow tests
        run: npm run test:e2e -w apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: apps/web/test-results/
